name: Feature request
description: Suggest a new feature or enhancement for BeamDisk.
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for suggesting an improvement. Please describe the problem you're trying to solve before jumping to a solution. That helps us evaluate the underlying need, not just one way to meet it.

  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: What can't you do today, or what's awkward? Concrete use cases help more than abstract wishes.
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: How would you like BeamDisk to behave? Sketches or rough flows are welcome.
    validations:
      required: true

  - type: textarea
    id: setup
    attributes:
      label: Your setup (if relevant)
      description: Your storage server or SAN, its software, and your network, if the request depends on them.

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other ways you've thought about solving this, including workarounds you're using now.

  - type: checkboxes
    id: checks
    attributes:
      label: Pre-flight checks
      options:
        - label: I searched existing issues and discussions and found no similar request.
          required: true
